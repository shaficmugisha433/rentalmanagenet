<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in · Rental Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login">
    <form id="f">
        <h1>Rental Management</h1>
        <p style="color:var(--mu)" id="sub">Sign in as landlord or tenant.</p>
        <div id="reg" hidden><label>Full name</label><input id="name"><label>Phone</label><input id="phone"
                placeholder="07XX XXX XXX"></div>
        <label>Email</label><input id="email" type="email" required><label>Password</label><input id="pw"
            type="password" required minlength="6">
        <div class="err" id="err"></div>
        <div class="row"><button class="gold" id="go">Sign in</button><button type="button" class="alt" id="sw">New
                tenant? Create account</button><a class="btn alt" href="tenant/index.html">Browse houses</a></div>
        <p style="color:var(--mu);font-size:13px">Demo landlord: admin@rms.ug / admin123</p>
    </form>
    <script src="js/app.js"></script>
</body>


</html>
